name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.target.asset_name }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux x86_64 (Static Musl)
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            asset_name: wgctl-linux-amd64
            type: docker-alpine-amd64

          # Linux ARM64 / Raspberry Pi / Graviton (Static Musl, Native ARM64 Runner)
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            asset_name: wgctl-linux-arm64
            type: docker-alpine-arm64

          # macOS (Apple Silicon M1/M2/M3/M4)
          - os: darwin
            arch: arm64
            runner: macos-latest
            asset_name: wgctl-darwin-arm64
            type: native-macos

          # Windows x64 Native (.exe)
          - os: windows
            arch: amd64
            runner: windows-latest
            asset_name: wgctl-windows-amd64.exe
            type: native-windows

    steps:
      - uses: actions/checkout@v4

      # 1. Linux AMD64 (Static Alpine Musl)
      - name: Build Linux AMD64 (Static)
        if: matrix.target.type == 'docker-alpine-amd64'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace crystallang/crystal:latest-alpine sh -c "
            apk add --no-cache make git
            crystal build --release --static --no-debug src/wgctl.cr -o ${{ matrix.target.asset_name }}
            strip -s ${{ matrix.target.asset_name }}
          "

      # 2. Linux ARM64 (Static Alpine Musl - Native ARM64 Runner)
      - name: Build Linux ARM64 (Static)
        if: matrix.target.type == 'docker-alpine-arm64'
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace crystallang/crystal:latest-alpine sh -c "
            apk add --no-cache make git
            crystal build --release --static --no-debug src/wgctl.cr -o ${{ matrix.target.asset_name }}
            strip -s ${{ matrix.target.asset_name }}
          "

      # 3. macOS Native
      - name: Install Crystal on macOS
        if: matrix.target.type == 'native-macos'
        uses: crystal-lang/install-crystal@v1

      - name: Build macOS Binary
        if: matrix.target.type == 'native-macos'
        run: |
          crystal build --release --no-debug src/wgctl.cr -o ${{ matrix.target.asset_name }}
          strip ${{ matrix.target.asset_name }}

      # 4. Windows Native
      - name: Install Crystal on Windows
        if: matrix.target.type == 'native-windows'
        uses: crystal-lang/install-crystal@v1

      - name: Build Windows .exe
        if: matrix.target.type == 'native-windows'
        shell: pwsh
        run: |
          crystal build --release --no-debug src/wgctl.cr -o ${{ matrix.target.asset_name }}

      # Upload Artifact
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.asset_name }}
          path: ${{ matrix.target.asset_name }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets/

      - name: Publish GitHub Release via gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"

          # Limpa eventual draft residual que tenha falhado anteriormente
          gh release delete "$TAG" --yes 2>/dev/null || true

          if [ -f "$NOTES_FILE" ]; then
            echo "Publicando release $TAG com notas de $NOTES_FILE..."
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            echo "Publicando release $TAG com notas geradas automaticamente..."
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

  docker:
    name: Build & Push Container Package (GHCR)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: wgctl-linux-amd64
          path: release-assets

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: wgctl-linux-arm64
          path: release-assets

      - name: Set executable permissions
        run: |
          chmod +x release-assets/wgctl-linux-amd64
          chmod +x release-assets/wgctl-linux-arm64
          ls -lh release-assets/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
